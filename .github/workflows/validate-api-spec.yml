name: Validate API Spec

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  lint-openapi:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml
