spring:
  application:
    name: scrumapp-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
  ratelimit:
    login-max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
    login-window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
    reset-max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS:3}
    reset-window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:1h}
