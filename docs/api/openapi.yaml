openapi: 3.0.3
info:
  title: Scrum App API
  version: 1.0.0
  description: >-
    API REST para la app de gestion de proyectos Scrum (backend Spring Boot,
    frontend Angular). Spec dividida en multiples archivos: ver
    docs/api/README.md para la convencion de carpetas y referencias.
servers:
  - url: http://localhost:8080/api/v1
    description: Entorno local de desarrollo

# Cada entrada enlaza, via JSON Pointer ($ref), al Path Item Object real
# definido en su archivo de origen dentro de docs/api/paths/.
paths:
  /auth/register:
    $ref: './paths/auth.yaml#/~1auth~1register'
  /auth/login:
    $ref: './paths/auth.yaml#/~1auth~1login'
  /auth/refresh:
    $ref: './paths/auth.yaml#/~1auth~1refresh'
  /auth/logout:
    $ref: './paths/auth.yaml#/~1auth~1logout'
  /auth/password/reset-request:
    $ref: './paths/auth.yaml#/~1auth~1password~1reset-request'
  /auth/password/reset-confirm:
    $ref: './paths/auth.yaml#/~1auth~1password~1reset-confirm'

  /workspaces:
    $ref: './paths/workspaces.yaml#/~1workspaces'
  /workspaces/{workspace_id}:
    $ref: './paths/workspaces.yaml#/~1workspaces~1{workspace_id}'
  /workspaces/{workspace_id}/members:
    $ref: './paths/workspaces.yaml#/~1workspaces~1{workspace_id}~1members'
  /workspaces/{workspace_id}/invitations:
    $ref: './paths/workspaces.yaml#/~1workspaces~1{workspace_id}~1invitations'
  /invitations/{token}/accept:
    $ref: './paths/workspaces.yaml#/~1invitations~1{token}~1accept'
  /workspaces/{workspace_id}/members/{user_id}:
    $ref: './paths/workspaces.yaml#/~1workspaces~1{workspace_id}~1members~1{user_id}'

  /users/me:
    $ref: './paths/users.yaml#/~1users~1me'
  /users/{user_id}:
    $ref: './paths/users.yaml#/~1users~1{user_id}'

  /workspaces/{workspace_id}/projects:
    $ref: './paths/projects.yaml#/~1workspaces~1{workspace_id}~1projects'
  /projects/{project_id}:
    $ref: './paths/projects.yaml#/~1projects~1{project_id}'

  /projects/{project_id}/sprints:
    $ref: './paths/sprints.yaml#/~1projects~1{project_id}~1sprints'
  /sprints/{sprint_id}:
    $ref: './paths/sprints.yaml#/~1sprints~1{sprint_id}'
  /sprints/{sprint_id}/start:
    $ref: './paths/sprints.yaml#/~1sprints~1{sprint_id}~1start'
  /sprints/{sprint_id}/close:
    $ref: './paths/sprints.yaml#/~1sprints~1{sprint_id}~1close'

  /projects/{project_id}/board:
    $ref: './paths/board.yaml#/~1projects~1{project_id}~1board'
  /projects/{project_id}/board/columns:
    $ref: './paths/board.yaml#/~1projects~1{project_id}~1board~1columns'
  /board/columns/{column_id}:
    $ref: './paths/board.yaml#/~1board~1columns~1{column_id}'

  /projects/{project_id}/stories:
    $ref: './paths/stories.yaml#/~1projects~1{project_id}~1stories'
  /stories/{story_id}:
    $ref: './paths/stories.yaml#/~1stories~1{story_id}'
  /stories/{story_id}/move:
    $ref: './paths/stories.yaml#/~1stories~1{story_id}~1move'

  /stories/{story_id}/tasks:
    $ref: './paths/tasks.yaml#/~1stories~1{story_id}~1tasks'
  /tasks/{task_id}:
    $ref: './paths/tasks.yaml#/~1tasks~1{task_id}'

  /entities/{entity_type}/{entity_id}/comments:
    $ref: './paths/comments.yaml#/~1entities~1{entity_type}~1{entity_id}~1comments'
  /comments/{comment_id}:
    $ref: './paths/comments.yaml#/~1comments~1{comment_id}'

  /projects/{project_id}/activity:
    $ref: './paths/activity.yaml#/~1projects~1{project_id}~1activity'

  /users/me/notifications:
    $ref: './paths/notifications.yaml#/~1users~1me~1notifications'
  /notifications/{notification_id}/read:
    $ref: './paths/notifications.yaml#/~1notifications~1{notification_id}~1read'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/securitySchemes.yaml#/bearerAuth'
  schemas:
    ProblemDetail:
      $ref: './components/schemas/common.yaml#/ProblemDetail'
    PageMetadata:
      $ref: './components/schemas/common.yaml#/PageMetadata'
  responses:
    BadRequest:
      $ref: './components/responses/errors.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses/errors.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses/errors.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses/errors.yaml#/NotFound'
    Conflict:
      $ref: './components/responses/errors.yaml#/Conflict'

security:
  - bearerAuth: []
